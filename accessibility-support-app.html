function initPlacesService() {

// 音声コマンドから施設タイプを判定
function detectPlaceType(text) {
  if (/トイレ|便所|化粧室/.test(text)) return { type: 'point_of_interest', keyword: 'トイレ 公衆', icon: '🚻', label: 'トイレ' };
  if (/病院|救急|クリニック|医院/.test(text)) return { type: 'hospital', keyword: '病院', icon: '🏥', label: '病院' };
  if (/薬局|ドラッグ|薬/.test(text)) return { type: 'pharmacy', keyword: '薬局', icon: '💊', label: '薬局' };
  if (/コンビニ|セブン|ローソン|ファミマ/.test(text)) return { type: 'convenience_store', keyword: 'コンビニ', icon: '🏪', label: 'コンビニ' };
  if (/駐車場|パーキング/.test(text)) return { type: 'parking', keyword: '駐車場', icon: '🅿️', label: '駐車場' };
  if (/駅|電車|地下鉄/.test(text)) return { type: 'subway_station', keyword: '駅', icon: '🚇', label: '駅' };
  if (/スーパー|食料/.test(text)) return { type: 'supermarket', keyword: 'スーパー', icon: '🛒', label: 'スーパー' };
  return null;
}

async function searchNearbyPlaces(text) {
  const placeType = detectPlaceType(text);
  if (!placeType) return null;
  if (!CURRENT_LOCATION.lat) return null;  // latがあれば検索実行

  return new Promise((resolve) => {
    if (!placesService) initPlacesService();
    if (!placesService) { resolve(null); return; }

    const location = new google.maps.LatLng(
      CURRENT_LOCATION.lat || MOCK_LOCATION.lat,
      CURRENT_LOCATION.lon || MOCK_LOCATION.lon
    );

    placesService.nearbySearch({
      location,
      radius: 2000,
      type: placeType.type,
      keyword: placeType.keyword,
      language: 'ja',
    }, (results, status) => {
      if (status === google.maps.places.PlacesServiceStatus.OK && results.length > 0) {
        const top3 = results.slice(0, 5).map(p => {
          const lat2 = p.geometry.location.lat();
          const lon2 = p.geometry.location.lng();
          const dist = calcDist(
            CURRENT_LOCATION.lat || MOCK_LOCATION.lat,
            CURRENT_LOCATION.lon || MOCK_LOCATION.lon,
            lat2, lon2
          );
          return {
            name: p.name,
            address: p.vicinity || '',
            dist,
            open: p.opening_hours?.isOpen?.(),
            rating: p.rating,
            icon: placeType.icon,
            lat: lat2, lon: lon2,
          };
        });
        resolve({ label: placeType.label, places: top3 });
      } else {
        resolve(null);
      }
    });
  });
}

function calcDist(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dL = (lat2-lat1)*Math.PI/180;
  const dO = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dL/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function formatPlacesResult(result) {
  const lines = result.places.map((p, i) => {
    const dist = p.dist < 1 ? Math.round(p.dist*1000)+'m' : p.dist.toFixed(1)+'km';
    const open = p.open === true ? '営業中' : p.open === false ? '休業中' : '';
    const rating = p.rating ? `⭐${p.rating}` : '';
    return `${i+1}. ${p.icon}${p.name}（${dist}${open?' '+open:''}${rating?' '+rating:''}）`;
  }).join('\n');
  return `近くの${result.label}を${result.places.length}件見つけました。\n${lines}`;
}

async function mockGetLocation() {
  setDot('listen');
  document.getElementById('locationText').textContent = '📡 GPS取得中...';
  document.getElementById('locationCoords').textContent = '';

  if (!navigator.geolocation) {
    useMockLocation();
    showToast('⚠ GPS非対応 — モック位置を使用');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);

      CURRENT_LOCATION = { lat, lon, isReal: true, address: '' };

      document.getElementById('locationCoords').textContent =
        `${lat.toFixed(5)}, ${lon.toFixed(5)} (精度 ±${acc}m)`;
      setDot('active');

      // 逆ジオコーディング（Google Geocoding API）
      try {
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode(
          { location: { lat, lng: lon }, language: 'ja' },
          (results, status) => {
            let addr;
            if (status === 'OK' && results[0]) {
              addr = results[0].formatted_address
                .replace('日本、', '')
                .replace(/〒[0-9-]+ /, '');
            } else {
              addr = `緯度${lat.toFixed(4)} 経度${lon.toFixed(4)}`;
            }
            CURRENT_LOCATION.address = addr;
            CURRENT_LOCATION.lat = lat;
            CURRENT_LOCATION.lon = lon;
            CURRENT_LOCATION.isReal = true;
            document.getElementById('locationText').textContent = addr;
            document.getElementById('locationCoords').textContent =
              `${lat.toFixed(5)}, ${lon.toFixed(5)} (精度 ±${acc}m)`;
            showToast('✅ GPS取得完了');
            speak('現在地は' + addr + 'です');
            // Places初期化を確実に実行
            initPlacesService();
          }
        );
      } catch(e) {
        const addr = `緯度${lat.toFixed(4)} 経度${lon.toFixed(4)}`;
        CURRENT_LOCATION.address = addr;
        document.getElementById('locationText').textContent = addr;
        showToast('✅ GPS取得完了');
      }
    },
    (err) => {
      const msgs = { 1:'位置情報の許可が必要です', 2:'GPS取得できません', 3:'タイムアウト' };
      showToast('⚠ ' + (msgs[err.code]||'GPSエラー') + ' — モック位置を使用');
      useMockLocation();
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function showRoute(cat, name, idx, e) {
  e.stopPropagation();
  const steps = MOCK_ROUTES[cat] || MOCK_ROUTES.default;

  document.getElementById('routeSteps').innerHTML = `

      <div><div>${s.text}</div><div class="route-step-dist">${s.dist}</div></div>
    </div>`).join('')}`;

// ===== カメラ =====
function setupCam() { document.getElementById('camWrap').addEventListener('click', toggleCam); }
async function toggleCam() {
  if (camStream) return;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'environment'} });
    const v = document.getElementById('camVideo');
    v.srcObject = camStream; v.style.display = 'block';
    document.getElementById('camPh').style.display = 'none';
    document.getElementById('sf').classList.add('on');
    document.getElementById('sl').classList.add('on');
    showToast('カメラ起動');
    setTimeout(analyzeCamera, 2000);
  } catch {
    showToast('カメラ未対応 → モック解析を表示');
    mockAnalyze();
  }
}
function stopCam() {
  if (camStream) { camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  document.getElementById('camVideo').style.display = 'none';
  document.getElementById('camPh').style.display = 'flex';
  document.getElementById('sf').classList.remove('on');
  document.getElementById('sl').classList.remove('on');
}
async function analyzeCamera() {
  const el = document.getElementById('at');
  el.textContent = '解析中...'; el.className = 'at loading';

  if (camStream) {
    // 実カメラがある場合はClaude APIで解析
    const v = document.getElementById('camVideo');
    const cv = document.getElementById('canvas');
    cv.width = v.videoWidth||640; cv.height = v.videoHeight||480;
    cv.getContext('2d').drawImage(v, 0, 0);
    const b64 = cv.toDataURL('image/jpeg', 0.8).split(',')[1];
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514', max_tokens: 300,
          messages: [{ role:'user', content: [
            { type:'image', source:{type:'base64',media_type:'image/jpeg',data:b64} },
            { type:'text', text:'視覚・身体障害者向け支援AIです。場所・環境・危険な障害物・移動アドバイスを100字以内でやさしく説明してください。' }
          ]}]
        })
      });
      const d = await res.json();
      const r = d.content?.[0]?.text || '';
      if (r) { el.textContent = r; el.className = 'at'; speak(r); return; }
    } catch {}
  }
  // カメラなし or API失敗 → モック解析
  mockAnalyze();
}
function mockAnalyze() {
  const el = document.getElementById('at');
  el.textContent = '解析中...'; el.className = 'at loading';
  setTimeout(() => {
    const result = MOCK_ANALYSIS[Math.floor(Math.random() * MOCK_ANALYSIS.length)];
    el.textContent = result; el.className = 'at';
    speak(result);
  }, 1500);
}

// ===== 音声認識 =====
function setupSR() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('vs').textContent = '⚠ 音声認識非対応（ボタンで操作できます）'; return; }
  recognition = new SR(); recognition.lang = 'ja-JP'; recognition.continuous = false; recognition.interimResults = true;
  recognition.onresult = e => {
    const t = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('vt').textContent = t;
    if (e.results[0].isFinal) processCmd(t);
  };
  recognition.onend = () => { isListening = false; document.getElementById('vbtn').className = 'vbtn'; document.getElementById('vs').textContent = 'マイクをタップして音声入力'; };
  recognition.onerror = () => { isListening = false; document.getElementById('vbtn').className = 'vbtn'; };
}
function toggleVoice() {
  if (!recognition) { showToast('音声認識非対応'); return; }
  if (isListening) { recognition.stop(); return; }
  recognition.start(); isListening = true;
  document.getElementById('vbtn').className = 'vbtn on';
  document.getElementById('vs').textContent = '聞いています...';
  setDot('listen');
}
function processCmd(text) {
  setDot('active');
  const nbs = document.querySelectorAll('.nb');
  if (text.includes('周囲')||text.includes('確認')||text.includes('見て')) {
    setTab(nbs[1],'camera'); if (!camStream) toggleCam(); else analyzeCamera();
  } else if (text.includes('現在地')||text.includes('どこ')||text.includes('位置')) {
    speak(CURRENT_LOCATION.address || MOCK_LOCATION.address); showToast('📍 現在地を読み上げます');
  } else if (text.includes('トイレ')) {
    setTab(nbs[2],'map'); setCat(document.querySelectorAll('.cat-chip')[1],'toilet');
    speak('近くのバリアフリートイレを表示します');
  } else if (text.includes('病院')||text.includes('救急')) {
    setTab(nbs[2],'map'); setCat(document.querySelectorAll('.cat-chip')[0],'hospital');
    speak('近くの病院を表示します');
  } else if (text.includes('コンビニ')) {
    setTab(nbs[2],'map'); setCat(document.querySelectorAll('.cat-chip')[3],'convenience');
    speak('近くのコンビニを表示します');
  } else if (text.includes('薬')) {
    setTab(nbs[2],'map'); setCat(document.querySelectorAll('.cat-chip')[2],'pharmacy');
    speak('近くの薬局を表示します');
  } else if (text.includes('助け')||text.includes('緊急')||text.includes('SOS')) {
    mockEmergency();
  } else {
    speak('ご要望を承りました。周辺の施設を確認してください');
    showToast('💬 「' + text + '」を受け取りました');
  }
}
function runCmd(cmd) { document.getElementById('vt').textContent = cmd; processCmd(cmd); }

// ===== 音声合成 =====
function speak(t) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.9; u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

// ===== UI ヘルパー =====
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
function setDot(s) { document.getElementById('dot').className = 'status-dot' + (s?' '+s:''); }
function setTab(btn, tab) {
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if (tab==='camera' && !camStream) toggleCam();
  if (tab==='map') { updateMapMarkers(curCat); }
}

let aiListening = false, aiRecognition = null;
const chatHistory = [];

function setupAiVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  aiRecognition = new SR();
  aiRecognition.lang = 'ja-JP';
  aiRecognition.continuous = false;

    const t = Array.from(e.results).map(r => r[0].transcript).join('');

}

function toggleAiVoice() {
  if (aiListening) { stopAiListen(); return; }

    showToast('音声認識非対応 — テキストで入力してください');

function stopAiListen() {

// 回答品質スコアリング（文字数・具体性・やさしさで評価）
function scoreAnswer(text) {
  if (!text) return 0;
  let score = 0;
  // 適切な長さ（30〜150字）
  const len = text.length;
  if (len >= 30 && len <= 150) score += 3;
  else if (len < 30) score += 1;
  else score += 2;
  // 具体的な情報（数字・固有名詞）
  if (/[0-9０-９]/.test(text)) score += 2;
  if (/番|号|メートル|分|時間|円/.test(text)) score += 1;
  // 緊急キーワードへの対応
  if (/119|110|救急|警察/.test(text)) score += 2;
  // やさしい言葉（です・ます調）
  if (/です|ます|ください/.test(text)) score += 1;
  return score;
}

async function aiAsk(question) {
  if (!question.trim()) return;

  document.getElementById('aiTextInput').value = '';

    addBubble('ai', msg);

    chatHistory.push({ role: 'user', content: question });
    chatHistory.push({ role: 'assistant', content: msg });
    document.getElementById('aiOrb').classList.remove('speaking');
    document.getElementById('aiStatus').textContent = '話しかけてください 🎤';
    setTimeout(() => { if (aiRecognition && !aiListening) toggleAiVoice(); }, 3000);
    return;
  }

  // 2つのローディングバブル
  const gptId  = 'gpt_'  + Date.now();
  const cldId  = 'cld_'  + Date.now();
  const bestId = 'best_' + Date.now();

  document.getElementById('aiOrb').classList.add('speaking');
  document.getElementById('aiStatus').textContent = 'ChatGPT & Claude に同時送信中...';

  chatHistory.push({ role: 'user', content: question });

  const loc = CURRENT_LOCATION.address || MOCK_LOCATION.address;
  const gpsInfo = CURRENT_LOCATION.isReal
    ? `現在地(GPS実測値): ${loc} [緯度${CURRENT_LOCATION.lat?.toFixed(4)} 経度${CURRENT_LOCATION.lon?.toFixed(4)}]`
    : `現在地(モック): ${loc}`;
  const systemPrompt = `あなたは障害者・高齢者向けの生活支援AIアシスタント「てのひら」です。ユーザーの現在地は「${gpsInfo}」です。やさしく、具体的に、簡潔に（150字以内）日本語で答えてください。緊急時は必ず119番・110番を案内してください。`;

  // GPT & Claude に並行リクエスト
  const [gptResult, cldResult] = await Promise.allSettled([
    // ChatGPT
    fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + OPENAI_KEY },
      body: JSON.stringify({
        model: 'gpt-4o-mini', max_tokens: 400,
        messages: [{ role: 'system', content: systemPrompt }, ...chatHistory.slice(-10)],
      })
    }).then(r => r.json()).then(d => d.choices?.[0]?.message?.content || ''),

    // Claude
    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 400,
        system: systemPrompt,
        messages: chatHistory.slice(-10),
      })
    }).then(r => r.json()).then(d => d.content?.[0]?.text || ''),
  ]);

  const gptText = gptResult.status === 'fulfilled' ? gptResult.value : '';
  const cldText = cldResult.status === 'fulfilled' ? cldResult.value : '';

  // スコアで良い方を選択
  const gptScore = scoreAnswer(gptText);
  const cldScore = scoreAnswer(cldText);
  const winner   = gptScore >= cldScore ? 'gpt' : 'claude';
  const bestText = winner === 'gpt' ? gptText : cldText;
  const winLabel = winner === 'gpt' ? '🟢 ChatGPT' : '🟣 Claude';
  const loseLabel= winner === 'gpt' ? '🟣 Claude' : '🟢 ChatGPT';
  const loseText = winner === 'gpt' ? cldText : gptText;

  // 採用回答を表示
  addBubble('ai', `${winLabel} が採用されました

${bestText}`, bestId);

  // 比較ボタン付きで両方の回答をサブ表示
  if (gptText && cldText) {
    const log = document.getElementById('chatLog');
    const detail = document.createElement('div');
    detail.style.cssText = 'margin:0 0 4px 0;font-size:0.7rem;color:var(--muted);cursor:pointer;text-align:center;';
    detail.textContent = `▼ ${loseLabel}の回答を見る`;
    detail.onclick = () => {
      const sub = document.createElement('div');
      sub.className = 'bubble ai';
      sub.style.opacity = '0.65';

  speak(bestText);
  document.getElementById('aiOrb').classList.remove('speaking');
  document.getElementById('aiStatus').textContent = `${winLabel} を読み上げ中`;
  window.speechSynthesis.addEventListener('end', () => {
    document.getElementById('aiStatus').textContent = '話しかけてください 🎤';
    // 回答後に自動で音声認識を再開
    setTimeout(() => {
      if (aiRecognition && !aiListening) toggleAiVoice();

  }, { once: true });
}

function addBubble(cls, text, id) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.textContent = text;
  if (id) div.id = id;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function replaceBubble(id, text) {
  const el = document.getElementById(id);
  if (el) { el.className = 'bubble ai'; el.textContent = text; }
  const log = document.getElementById('chatLog');
  log.scrollTop = log.scrollHeight;
}
