<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>マイティ</title>
<style>
:root{--bg:#0a0f1e;--card:#1a2540;--accent:#38bdf8;--accent2:#818cf8;--green:#34d399;--red:#f87171;--text:#e2e8f0;--muted:#64748b;--border:rgba(56,189,248,0.15);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;}
header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.logo{font-size:1.4rem;color:var(--accent);font-weight:700;}
.badge{padding:3px 8px;background:rgba(56,189,248,0.15);border:1px solid var(--border);border-radius:12px;font-size:0.65rem;color:var(--accent);}
.card{margin:12px 20px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:16px 16px 0 0;}
.label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.loc-text{font-size:0.95rem;line-height:1.5;}
.loc-coord{font-size:0.68rem;color:var(--muted);margin-top:4px;font-family:monospace;}
.row{display:flex;gap:6px;margin-top:10px;}
.btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:rgba(56,189,248,0.08);color:var(--accent);font-size:0.75rem;font-family:inherit;cursor:pointer;}
.btn.red{color:var(--red);border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.08);}
/* AI会話 */
.chat-wrap{margin:0 20px 12px;height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.bubble{padding:10px 14px;border-radius:14px;font-size:0.84rem;line-height:1.6;max-width:90%;}
.bubble.ai{background:rgba(129,140,248,0.12);border:1px solid rgba(129,140,248,0.2);align-self:flex-start;}
.bubble.user{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.25);align-self:flex-end;}
.orb-wrap{text-align:center;padding:16px 0 8px;}
.orb{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent);background:rgba(56,189,248,0.1);color:var(--accent);font-size:2rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .3s;}
.orb.on{background:rgba(56,189,248,0.25);box-shadow:0 0 0 12px rgba(56,189,248,0.1);animation:pulse 1s infinite;}
.orb.speaking{background:rgba(129,140,248,0.2);border-color:var(--accent2);box-shadow:0 0 0 12px rgba(129,140,248,0.1);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.orb-status{font-size:0.78rem;color:var(--muted);text-align:center;margin-top:6px;}
.input-row{margin:0 20px 10px;display:flex;gap:6px;}
.txt-input{flex:1;padding:10px 14px;background:#111827;border:1px solid var(--border);border-radius:24px;color:var(--text);font-size:0.84rem;font-family:inherit;}
.txt-input:focus{outline:none;border-color:var(--accent);}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent2);border:none;color:#fff;font-size:1.1rem;cursor:pointer;}
.quick{display:flex;gap:5px;margin:0 20px 10px;overflow-x:auto;}
.qbtn{padding:5px 12px;border-radius:20px;border:1px solid rgba(129,140,248,0.3);background:rgba(129,140,248,0.08);color:var(--accent2);font-size:0.72rem;white-space:nowrap;cursor:pointer;font-family:inherit;}
/* ナビ */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,15,30,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;}
.nb{flex:1;padding:10px 6px;background:none;border:none;color:var(--muted);font-size:0.6rem;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nb.active{color:var(--accent);}
.ni{font-size:1.2rem;}
.tab{display:none;}.tab.active{display:block;}
.status{width:9px;height:9px;border-radius:50%;background:var(--muted);}
.status.on{background:var(--green);animation:pulse 2s infinite;}
.contacts-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:none;align-items:flex-end;}
.contacts-modal.open{display:flex;}
.contacts-sheet{background:#111827;border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:20px;}
.contacts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.contacts-title{font-size:1rem;font-weight:700;color:var(--accent);}
.contacts-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;}
.contact-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .2s;}
.contact-item:hover{border-color:var(--accent);}
.contact-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.contact-info{flex:1;}
.contact-name{font-size:0.9rem;font-weight:700;}
.contact-rel{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.contact-num{font-size:0.78rem;color:var(--accent);margin-top:2px;font-family:monospace;}
.contact-actions{display:flex;gap:6px;}
.c-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(56,189,248,0.1);color:var(--accent);font-size:0.72rem;cursor:pointer;font-family:inherit;}
.c-btn.sms{color:var(--green);border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.1);}
.add-contact-btn{width:100%;padding:12px;border-radius:12px;border:2px dashed var(--border);background:none;color:var(--muted);font-size:0.85rem;font-family:inherit;cursor:pointer;margin-top:4px;}
.contact-item.emergency{border-color:rgba(248,113,113,0.5);background:rgba(248,113,113,0.05);}
.emergency-badge{padding:2px 7px;background:rgba(248,113,113,0.2);color:var(--red);border-radius:10px;font-size:0.65rem;margin-left:6px;}
.confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.confirm-modal.open{display:flex;}
.confirm-box{background:#111827;border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center;}
.confirm-box::before{content:'';display:block;width:60px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;margin:0 auto 16px;}
.confirm-name{font-size:1.3rem;font-weight:700;margin-bottom:4px;}
.confirm-rel{font-size:0.8rem;color:var(--muted);margin-bottom:4px;}
.confirm-num{font-size:0.9rem;color:var(--accent);font-family:monospace;margin-bottom:20px;}
.confirm-btns{display:flex;flex-direction:column;gap:8px;}
.confirm-call{padding:14px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;}
.confirm-sms{padding:12px;background:rgba(52,211,153,0.15);color:var(--green);border:1px solid rgba(52,211,153,0.3);border-radius:12px;font-size:0.9rem;font-family:inherit;cursor:pointer;}
.confirm-cancel{padding:10px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:12px;font-size:0.85rem;font-family:inherit;cursor:pointer;}

.add-form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:none;}
.add-form.open{display:block;}
.form-input{width:100%;padding:9px 12px;background:#0a0f1e;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.84rem;font-family:inherit;margin-bottom:8px;}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-row{display:flex;gap:6px;}

.cam-wrap{margin:0 20px 10px;border-radius:16px;overflow:hidden;border:1px solid var(--border);aspect-ratio:4/3;background:#000;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
video{width:100%;height:100%;object-fit:cover;display:none;}
.cam-ph{text-align:center;color:var(--muted);}
.cam-ph div:first-child{font-size:3rem;margin-bottom:8px;}
.sf{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:65%;aspect-ratio:1;border:2px solid rgba(56,189,248,0.6);border-radius:12px;display:none;pointer-events:none;}
.sf.on{display:block;}
.sf::before,.sf::after{content:'';position:absolute;width:18px;height:18px;border-color:var(--accent);border-style:solid;}
.sf::before{top:-2px;left:-2px;border-width:2px 0 0 2px;border-radius:4px 0 0 0;}
.sf::after{bottom:-2px;right:-2px;border-width:0 2px 2px 0;border-radius:0 0 4px 0;}
.scan{position:absolute;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 2s ease-in-out infinite;display:none;}
.scan.on{display:block;}
@keyframes scan{0%{top:0}100%{top:100%}}
.cam-btns{margin:0 20px 10px;display:flex;gap:6px;}
.result-card{margin:0 20px 10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
.result-text{font-size:0.86rem;line-height:1.7;color:var(--muted);}
.result-text.done{color:var(--text);}
.result-text.loading{animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.scan-mode-btns{margin:0 20px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;}

</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マイティ">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">マイティ 🎤</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="badge">MIGHTY-v1.3</span>
      <div class="status" id="dot"></div>
    </div>
  </header>

  <!-- ホームタブ -->
  <div class="tab active" id="tab-home">
    <div class="card">
      <div class="label">📍 現在地</div>
      <div class="loc-text" id="locText">取得中...</div>
      <div class="loc-coord" id="locCoord"></div>
      <div class="row">
        <button class="btn" onclick="getGPS()">🔄 更新</button>
        <button class="btn" onclick="sharePos()">📤 共有</button>
        <button class="btn red" onclick="emergency()">🆘 緊急</button>
      </div>
    </div>

    <div class="card" style="padding-top:12px;">
      <div class="label" style="margin-bottom:8px;">💬 クイックコマンド</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
        <button class="btn" onclick="goAI('今の場所はどこですか')">📍 現在地を教えて</button>
        <button class="btn" onclick="goAI('近くのトイレを探して')">🚻 トイレを探して</button>
        <button class="btn" onclick="goAI('近くの病院を探して')">🏥 病院を探して</button>
        <button class="btn" onclick="goAI('助けを呼んで')">🆘 助けを呼んで</button>
        <button class="btn" onclick="openContacts()" style="grid-column:span 2">📱 電話帳を開く</button>
      </div>
    </div>
  </div>


  <!-- カメラタブ -->
  <div class="tab" id="tab-cam">
    <div class="cam-wrap" id="camWrap" onclick="toggleCam()">
      <video id="camVideo" autoplay playsinline></video>
      <div class="cam-ph" id="camPh">
        <div>📷</div>
        <div style="font-size:0.82rem">タップしてカメラを起動</div>
        <div id="camErrMsg" style="font-size:0.72rem;color:var(--red);margin-top:6px;padding:0 10px;"></div>
      </div>
      <div class="sf" id="sf"><div class="scan" id="scan"></div></div>
    </div>
    <canvas id="canvas" style="display:none"></canvas>

    <div class="scan-mode-btns">
      <button class="btn" onclick="analyzeRoom('indoor')">🏠 室内・間取り解析</button>
      <button class="btn" onclick="analyzeRoom('obstacle')">⚠️ 障害物・段差検出</button>
      <button class="btn" onclick="analyzeRoom('exit')">🚪 出口・経路案内</button>
      <button class="btn" onclick="analyzeRoom('general')">🔍 周囲の状況確認</button>
    </div>

    <div class="result-card">
      <div class="label">🤖 AI解析結果</div>
      <div class="result-text" id="resultText">カメラを起動して解析モードを選択してください</div>
    </div>

    <div class="cam-btns">
      <button class="btn" style="flex:2" onclick="analyzeRoom('general')">📸 今すぐ解析</button>
      <button class="btn" onclick="stopCam()">⏹ 停止</button>
    </div>
  </div>

  <!-- AIタブ -->
  <div class="tab" id="tab-ai">

    <!-- 大きなマイクボタン（中央） -->
    <div style="display:flex;flex-direction:column;align-items:center;padding:24px 0 16px;">
      <div id="orb" onclick="toggleMic()" style="
        width:110px;height:110px;border-radius:50%;
        border:3px solid var(--accent);
        background:rgba(56,189,248,0.12);
        color:var(--accent);font-size:3rem;
        cursor:pointer;display:flex;align-items:center;justify-content:center;
        transition:all .3s;position:relative;
        box-shadow:0 0 0 0 rgba(56,189,248,0.3);
      ">🎤</div>
      <div id="orbStatus" style="margin-top:12px;font-size:0.85rem;color:var(--muted);text-align:center;">
        タップして話しかける
      </div>
      <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;opacity:0.6;">
        タップでオン/オフ・テキスト入力も可
      </div>
    </div>

    <!-- クイック質問 -->
    <div class="quick">
      <button class="qbtn" onclick="sendMsg('今の場所はどこですか')">📍 現在地</button>
      <button class="qbtn" onclick="sendMsg('近くのトイレを探して')">🚻 トイレ</button>
      <button class="qbtn" onclick="sendMsg('近くの病院を探して')">🏥 病院</button>
      <button class="qbtn" onclick="sendMsg('体調が悪いです')">💊 体調</button>
      <button class="qbtn" onclick="sendMsg('緊急です助けてください')">🆘 緊急</button>
    </div>

    <!-- 会話ログ -->
    <div class="chat-wrap" id="chatWrap"></div>

    <!-- テキスト入力 -->
    <div class="input-row">
      <input class="txt-input" id="txtInput" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter')sendMsg()"/>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="nb active" onclick="setTab(this,'home')"><span class="ni">🏠</span>ホーム</button>
  <button class="nb" onclick="setTab(this,'cam');startCam()"><span class="ni">📷</span>カメラ</button>
  <button class="nb" onclick="setTab(this,'ai')"><span class="ni">🤖</span>AI</button>
</nav>

<script>
// ===== 状態 =====
const OPENAI_KEY = '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';
let lat = null, lon = null, addr = '';
let recog = null, recogOn = false;
let history = [];

// ===== 起動 =====
window.addEventListener('load', () => {
  setupRecog();

  // AIタブを表示
  const aiBtn = document.querySelector('.nb:nth-child(3)');
  if (aiBtn) setTab(aiBtn, 'ai');

  // 起動メッセージ表示
  addBubble('ai', '⚡ 起動中... GPS・マイク・カメラを準備しています');
  // PWAインストール促進
  if (window.matchMedia('(display-mode: browser)').matches) {
    setTimeout(() => {
      addBubble('ai', '💡 ヒント: ホーム画面に追加すると「マイティ」アイコンから素早く起動できます。ブラウザのメニュー→「ホーム画面に追加」をタップしてください。');
    }, 5000);
  }

  // 少し待ってから全機能オン
  setTimeout(startAllFeatures, 800);
});




// ===== 包括的音声コマンドエンジン =====
const VOICE_COMMANDS = [
  // ナビゲーション
  { p:/ホーム|最初の画面|トップ/,          fn: () => goTab(1, 'home', 'ホーム画面に移動しました') },
  { p:/カメラ(を開|タブ|画面)/,            fn: () => goTabCam() },
  { p:/AI|アシスタント(を開|タブ|画面)/,   fn: () => goTab(3, 'ai', 'AIアシスタント画面に移動しました') },

  // GPS・位置情報
  { p:/GPS.*更新|位置.*更新|現在地.*更新/, fn: () => { speak('現在地を更新します'); stopGPSWatch(); startGPSWatch(); } },
  { p:/現在地|今の場所|どこにい|場所を教/, fn: () => replyAddr() },
  { p:/位置.*共有|場所.*送/,               fn: () => { sharePos(); speak('現在地を共有します') } },

  // カメラ操作
  { p:/カメラ(を起動|オン|開始)/,          fn: () => goTabCam() },
  { p:/カメラ(を止|オフ|停止)/,            fn: () => { stopCam(); speak('カメラを停止しました') } },
  { p:/室内.*解析|間取り|部屋.*確認/,      fn: () => goTabCamAnalyze('indoor') },
  { p:/障害物|段差.*確認|危険.*確認/,      fn: () => goTabCamAnalyze('obstacle') },
  { p:/出口|避難.*経路/,                   fn: () => goTabCamAnalyze('exit') },
  { p:/周り.*見て|周囲.*確認|今すぐ.*解析/,fn: () => goTabCamAnalyze('general') },

  // マイク操作

  // 電話帳・連絡先
  { p:/電話帳|連絡先(を開|を見)/,          fn: () => openContacts() },
  { p:/緊急連絡先(を開|に電話|を呼)/,      fn: () => callEmergencyContact() },
  { p:/お?母(さん)?.*(電話|連絡)/,         fn: () => callByRel('母') },
  { p:/お?父(さん)?.*(電話|連絡)/,         fn: () => callByRel('父') },
  { p:/家族.*(電話|連絡)/,                 fn: () => openContacts() },
  { p:/かかりつけ.*(電話|連絡)/,           fn: () => callByRel('病院') },

  // 施設検索→Googleマップ起動
  { p:/病院.*探|近く.*病院/,               fn: () => searchMap('病院 救急') },
  { p:/トイレ.*探|近く.*トイレ/,           fn: () => searchMap('公共トイレ バリアフリー') },
  { p:/薬局.*探|近く.*薬/,                 fn: () => searchMap('薬局') },
  { p:/コンビニ.*探|近く.*コンビニ/,       fn: () => searchMap('コンビニエンスストア') },
  { p:/駐車場.*探|近く.*駐車/,             fn: () => searchMap('駐車場 障害者') },
  { p:/駅.*探|近く.*駅/,                   fn: () => searchMap('駅 バリアフリー') },
  { p:/スーパー.*探|近く.*スーパー/,       fn: () => searchMap('スーパーマーケット') },
  { p:/ルート|道.*教|案内して/,             fn: () => openMap() },

  // 緊急
  { p:/119|救急車/,                         fn: () => callNumber('119', '119番に発信します') },
  { p:/110|警察/,                           fn: () => callNumber('110', '110番に発信します') },
  { p:/助けて|緊急(事態|です)|倒れ/,       fn: () => emergencyFlow() },

  // 設定・状態
  { p:/バッテリー|電池/,                    fn: () => reportBattery() },
  { p:/今の時間|何時/,                      fn: () => reportTime() },
  { p:/機能.*止|全部.*止|省電力/,           fn: () => { stopAllFeatures(); speak('全機能を停止しました') } },
  { p:/機能.*再開|再起動/,                  fn: () => startAllFeatures() },
  { p:/ホーム.*追加|アイコン.*追加|インストール/, fn: () => guidePWAInstall() },
  { p:/連絡先.*削除|削除.*連絡先/,          fn: () => { openContacts(); speak('削除したい連絡先のゴミ箱ボタンをタップしてください。') } },
  { p:/連絡先.*追加|追加.*連絡先/,          fn: () => { openContacts(); setTimeout(toggleAddForm, 500); speak('新しい連絡先を追加します。') } },
];

// コマンドマッチング
function matchVoiceCommand(q) {
  for (const cmd of VOICE_COMMANDS) {
    if (cmd.p.test(q)) { cmd.fn(); return true; }
  }
  // 電話番号直接指定
  if (detectAndCall(q)) return true;
  return false;

// 連絡先を選択→確認モーダル表示＋音声確認
async function selectContact(id) {
  const c = contacts.find(x=>x.id===id);
  if (!c) return;
  confirmTarget = c;

  if (!c.number) {
    const num = prompt(`${c.name}の電話番号を入力してください:`,'');
    if (num) { c.number = num; saveContacts(); renderContacts(); }
    else return;
  }

  // 確認モーダル表示
  document.getElementById('confirmName').textContent = c.name;
  document.getElementById('confirmRel').textContent = c.rel;
  document.getElementById('confirmNum').textContent = c.number;
  document.getElementById('confirmModal').classList.add('open');

  // 音声で確認
  const msg = `${c.name}に連絡します。電話をかけますか？それともSMSメッセージを送りますか？`;
  await aiSay(msg);
  startMic(); // 音声で「電話」「SMS」を待つ
}

function closeConfirm() {

// 連絡先編集
function editContact(id) {
  const c = contacts.find(x => x.id === id);
  if (!c) return;
  const name = prompt('名前:', c.name);
  if (name === null) return;
  const rel  = prompt('関係（例：母・父・兄）:', c.rel);
  if (rel === null) return;
  const num  = prompt('電話番号:', c.number);
  if (num === null) return;
  c.name = name || c.name;
  c.rel  = rel  || c.rel;
  c.number = num;
  saveContacts();
  renderContacts();
  speak(c.name + 'の情報を更新しました。');
}

// 連絡先削除
function deleteContact(id) {
  const c = contacts.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`「${c.name}」を削除しますか？`)) return;
  contacts = contacts.filter(x => x.id !== id);
  saveContacts();
  renderContacts();
  speak(c.name + 'を削除しました。');
}

// 緊急フラグ切替
function toggleEmergency(id) {
  const c = contacts.find(x=>x.id===id);
  if (!c) return;
  c.emergency = !c.emergency;
  saveContacts(); renderContacts();
  speak(c.name + 'を' + (c.emergency ? '緊急連絡先に設定しました。' : '通常連絡先に変更しました。'));
}

// 音声選択モード中のコマンド処理
function handleVoiceSelect(q) {
  // 番号で選択（「1番」「2番目」など）
  const numMatch = q.match(/([1-9１-９])番/);
  if (numMatch) {
    const idx = parseInt(numMatch[1]) - 1;
    if (contacts[idx]) { selectContact(contacts[idx].id); return true; }
  }

  // 確認モーダル中の「電話」「SMS」
  if (confirmTarget) {
    if (/電話|はい|かける|発信/.test(q)) { doCall(); return true; }
    if (/SMS|メッセージ|送る|テキスト/.test(q)) { doSms(); return true; }
    if (/キャンセル|やめ|戻/.test(q)) { closeConfirm(); return true; }
  }

  // 名前で選択
  for (const c of contacts) {
    if (q.includes(c.name) || q.includes(c.rel)) {
      selectContact(c.id); return true;
    }
  }
  return false;
}

  const name = document.getElementById('newName').value.trim();

  if (!name) { alert('名前を入力してください'); return; }

  document.getElementById('addForm').classList.remove('open');

// 音声で家族を指定して電話
function callByVoice(q) {
  const keywords = [
    { pattern:/お?母|ママ/i, rel:'母' },
    { pattern:/お?父|パパ/i, rel:'父' },
    { pattern:/兄|お兄/i,   rel:'兄' },
    { pattern:/姉|お姉/i,   rel:'姉' },
    { pattern:/弟/i,        rel:'弟' },
    { pattern:/妹/i,        rel:'妹' },
    { pattern:/おばあ|祖母/i,rel:'祖母' },
    { pattern:/おじい|祖父/i,rel:'祖父' },
    { pattern:/かかりつけ|医者/i,rel:'病院' },
    { pattern:/緊急/i,      rel:'緊急連絡先' },
  ];
  for (const kw of keywords) {
    if (kw.pattern.test(q)) {
      const c = contacts.find(x=>x.rel.includes(kw.rel)||x.name.includes(kw.rel));
      if (c) { selectContact(c.id); return true; }
    }
  }
  return false;
}

// ===== スマホアプリ起動 =====
function launchApp(type, params) {
  const schemes = {
    call:    (p) => `tel:${p.number}`,
    sms:     (p) => `sms:${p.number}${p.body ? '?body='+encodeURIComponent(p.body) : ''}`,
    map:     (p) => `https://maps.google.com/?q=${p.query || (lat+','+lon)}&near=${lat},${lon}`,
    email:   (p) => `mailto:${p.to||''}?subject=${encodeURIComponent(p.subject||'')}`,
    browser: (p) => p.url,
  };
  const url = schemes[type]?.(params);
  if (url) window.location.href = url;
}

// 状況判断エンジン
function analyzeIntent(q) {
  const intents = [
    // 電話・通話
    { pattern: /電話.*119|119.*電話|救急車|救急/, action: 'call_119' },
    { pattern: /電話.*110|110.*電話|警察/, action: 'call_110' },
    { pattern: /電話.*117|時報/, action: 'call_117' },
    { pattern: /電話し|電話かけ|発信|電話をかけ/, action: 'call_prompt' },
    // マップ・施設検索
    { pattern: /近く.*病院|病院.*探|救急.*病院/, action: 'map_hospital' },
    { pattern: /近く.*トイレ|トイレ.*探|公衆トイレ/, action: 'map_toilet' },
    { pattern: /近く.*薬局|薬局.*探|ドラッグ/, action: 'map_pharmacy' },
    { pattern: /近く.*コンビニ|コンビニ.*探/, action: 'map_convenience' },
    { pattern: /近く.*駐車|駐車場.*探/, action: 'map_parking' },
    { pattern: /近く.*駅|駅.*探/, action: 'map_station' },
    { pattern: /道.*教|ルート|行き方|案内し/, action: 'map_navigate' },
    // カメラ
    { pattern: /周り.*見て|周囲.*確認|カメラ.*起動|撮影/, action: 'camera' },
    { pattern: /間取り|部屋.*解析|室内.*確認/, action: 'camera_indoor' },
    { pattern: /段差|障害物|危険.*確認/, action: 'camera_obstacle' },
    // SMS
    { pattern: /メッセージ.*送|SMS.*送|連絡.*送/, action: 'sms_prompt' },
    // 緊急
    { pattern: /助けて|緊急|倒れ|動けない|具合.*悪/, action: 'emergency' },
  ];
  for (const i of intents) {
    if (i.pattern.test(q)) return i.action;
  }
  return null;
}

// 電話番号パターンを検出して発信
function detectAndCall(q) {
  const numMatch = q.match(/([0-9０-９]{2,4}[-−ー]?[0-9０-９]{3,4}[-−ー]?[0-9０-９]{4})/);
  if (numMatch) {
    const num = numMatch[1].replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[-−ー]/g,'');
    aiSay(num + 'に電話します。').then(() => launchApp('call', {number:num}));
    return true;
  }
  return false;
}

function aiSay(text) {
  return new Promise(resolve => {
    addBubble('ai', text);
    speak(text);
    setTimeout(resolve, Math.max(1500, text.length * 80));
  });
}


// ===== 電力管理 =====
let gpsWatcher = null;
let micTimer = null;
let camTimer = null;
const IDLE_MIC_SEC  = 30;  // 無音30秒でマイクオフ
const IDLE_CAM_SEC  = 60;  // 未操作60秒でカメラオフ
const GPS_INTERVAL  = 60000; // GPS更新間隔（1分）

// 起動時に全機能を一括オン
async function startAllFeatures() {
  addBubble('ai', '⚡ 起動中... GPS・マイク・カメラを準備しています');
  // PWAインストール促進
  if (window.matchMedia('(display-mode: browser)').matches) {
    setTimeout(() => {
      addBubble('ai', '💡 ヒント: ホーム画面に追加すると「マイティ」アイコンから素早く起動できます。ブラウザのメニュー→「ホーム画面に追加」をタップしてください。');
    }, 5000);
  }

  // GPS：watchPositionで継続取得（1分間隔）
  startGPSWatch();

  // マイク：自動スタート
  await new Promise(r => setTimeout(r, 1000));
  startMic();
  resetMicTimer();

  speak('お困りごとはありますか？');
}

// アプリ終了・バックグラウンド時に全機能オフ
function stopAllFeatures() {
  stopGPSWatch();
  stopMic();
  stopCam();
  clearTimeout(micTimer);
  clearTimeout(camTimer);
  addBubble('ai', '💤 省電力モード: GPS・マイク・カメラを停止しました');
}

// GPS継続監視（バッテリー考慮で低精度モード）
function startGPSWatch() {
  if (gpsWatcher) return;
  if (!navigator.geolocation) return;
  gpsWatcher = navigator.geolocation.watchPosition(
    async pos => {
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);
      document.getElementById('locCoord').textContent =
        `${lat.toFixed(5)}, ${lon.toFixed(5)} (±${acc}m)`;
      document.getElementById('dot').className = 'status on';
      // 住所は30秒に1回だけ更新
      if (!gpsWatcher._lastAddr || Date.now() - gpsWatcher._lastAddr > 30000) {
        gpsWatcher._lastAddr = Date.now();
        try {
          const r = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ja`
          );
          const d = await r.json();
          const a = d.address;
          addr = [a.city||a.town||a.village, a.suburb||a.neighbourhood, a.road]
            .filter(Boolean).join('') || d.display_name.split(',')[0];
          document.getElementById('locText').textContent = addr;
        } catch {}
      }
    },
    err => {
      document.getElementById('dot').className = 'status';
      document.getElementById('locText').textContent = 'GPS取得エラー';
    },
    { enableHighAccuracy: false, timeout: 15000, maximumAge: GPS_INTERVAL }
    // ※ enableHighAccuracy:false でバッテリー消耗を抑制
  );
}

function stopGPSWatch() {
  if (gpsWatcher) {
    navigator.geolocation.clearWatch(gpsWatcher);
    gpsWatcher = null;
    document.getElementById('dot').className = 'status';
  }
}

// マイク無音タイマー（30秒で自動オフ）
function resetMicTimer() {
  clearTimeout(micTimer);

function resetCamTimer() {

    if (camStream) {

}

// ページ表示/非表示でオン/オフ
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {

    clearTimeout(micTimer);

  }
});

// ===== GPS =====
function getGPS() {
  document.getElementById('locText').textContent = '📡 取得中...';
  document.getElementById('dot').className = 'status';
  if (!navigator.geolocation) { document.getElementById('locText').textContent = 'GPS非対応'; return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    lat = pos.coords.latitude;
    lon = pos.coords.longitude;
    const acc = Math.round(pos.coords.accuracy);
    document.getElementById('locCoord').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)} (±${acc}m)`;
    document.getElementById('dot').className = 'status on';
    // Nominatimで住所取得
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ja`);
      const d = await r.json();
      const a = d.address;
      addr = [a.city||a.town||a.village, a.suburb||a.neighbourhood, a.road].filter(Boolean).join('') || d.display_name.split(',')[0];
      document.getElementById('locText').textContent = addr;
      speak('現在地は' + addr + 'です');
    } catch {
      addr = `緯度${lat.toFixed(4)} 経度${lon.toFixed(4)}`;
      document.getElementById('locText').textContent = addr;
    }
  }, err => {
    const m = {1:'位置情報を許可してください',2:'GPS取得できません',3:'タイムアウト'};
    document.getElementById('locText').textContent = m[err.code]||'GPSエラー';
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
}

function sharePos() {
  if (!lat) return;
  const url = `https://maps.google.com/?q=${lat},${lon}`;
  if (navigator.share) navigator.share({title:'現在地',url});
  else navigator.clipboard?.writeText(url).then(()=>alert('URLをコピーしました'));
}

function emergency() {
  if (confirm(`緊急通報しますか？\n現在地: ${addr||'不明'}`)) {
    speak('緊急通報します。現在地は' + (addr||'不明') + 'です');
    window.location.href = 'tel:119';
  }
}

// ===== AI会話 =====
async function sendMsg(text) {
  const q = text || document.getElementById('txtInput').value.trim();
  if (!q) return;
  document.getElementById('txtInput').value = '';
  addBubble('user', q);
  setOrbState('speaking');

  // ===== 音声コマンド→アプリ操作 =====

  // 音声選択モード中（電話帳・確認モーダル）
  if (voiceSelectMode || confirmTarget) {
    if (handleVoiceSelect(q)) { setOrbState('idle'); schedNext(); return; }
  }

  // 包括的音声コマンドエンジン
  const cmdMatched = matchVoiceCommand(q);
  if (cmdMatched) { setOrbState('idle'); schedNext(); return; }

  // ===== GPT APIで回答 =====
  history.push({role:'user', content:q});
  const sys = `あなたは生活支援AIアシスタント「マイティ」です。
ユーザーの現在地は「${addr||'不明'}」です。
やさしく簡潔に日本語で答えてください（150字以内）。
施設を探す場合は「近くの〇〇はマップで検索できます」と案内してください。
緊急時は119番・110番を案内してください。`;

  let ans = '';

  // Claude APIで回答（メイン）
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 300,
        system: sys,
        messages: history.slice(-8)
      })
    });
    const d = await res.json();
    ans = d.content?.[0]?.text || '';
  } catch {}

  // ChatGPTで回答（サブ）
  if (!ans) {
    try {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + OPENAI_KEY },
        body: JSON.stringify({ model: 'gpt-4o-mini', max_tokens: 300,
          messages: [{ role: 'system', content: sys }, ...history.slice(-8)] })
      });
      const d = await res.json();
      ans = d.choices?.[0]?.message?.content || '';
    } catch {}
  }

  if (ans) {
    addBubble('ai', ans);
    speak(ans);
    history.push({ role: 'assistant', content: ans });
  } else {
    const fb = fallback(q);
    addBubble('ai', fb);
    speak(fb);
  }
  setOrbState('idle');
  schedNext();
}

function fallback(q) {
  if (/トイレ/.test(q)) return `近くのトイレをお探しですね。現在地(${addr||'不明'})周辺のトイレはGoogleマップで「多目的トイレ」と検索すると見つかります。`;
  if (/病院|救急|医院/.test(q)) return `病院が必要でしょうか。緊急の場合は119番へ。現在地は${addr||'不明'}です。`;
  if (/薬|薬局/.test(q)) return `近くの薬局を探すにはGoogleマップで「薬局」と検索してください。`;
  return `ご質問ありがとうございます。詳しい案内のためにはネットワーク接続をご確認ください。緊急の場合は119番・110番へ。`;
}

function goAI(msg) {
  setTab(document.querySelector('.nb:nth-child(2)'), 'ai');
  setTimeout(() => sendMsg(msg), 300);
}

function addBubble(who, txt) {
  const w = document.getElementById('chatWrap');
  const d = document.createElement('div');
  d.className = 'bubble ' + who;
  d.textContent = txt;
  w.appendChild(d);
  w.scrollTop = w.scrollHeight;
}

// ===== 音声認識 =====
function setupRecog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('orbStatus').textContent = '音声認識非対応 — テキスト入力をご使用ください'; return; }
  recog = new SR();
  recog.lang = 'ja-JP'; recog.continuous = false; recog.interimResults = true;
  recog.onresult = e => {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('txtInput').value = t;
    resetMicTimer(); // 音声検出でタイマーリセット
    if (e.results[0].isFinal) { stopMic(); sendMsg(t); }
  };
  recog.onend = () => stopMic();
  recog.onerror = () => stopMic();
}

function toggleMic() {
  if (recogOn) stopMic();
  else startMic();
}

function startMic() {
  if (!recog) return;
  try { recog.start(); recogOn = true; setOrbState('listening'); document.getElementById('orbStatus').textContent = '聞いています...'; }
  catch {}
}

function stopMic() {
  recogOn = false;
  try { recog?.stop(); } catch {}
  setOrbState('idle');
  document.getElementById('orbStatus').textContent = 'タップして話しかける';
}

function setOrbState(s) {
  const o = document.getElementById('orb');
  const status = document.getElementById('orbStatus');
  if (s === 'listening') {
    o.style.background = 'rgba(56,189,248,0.25)';
    o.style.borderColor = 'var(--accent)';
    o.style.boxShadow = '0 0 0 16px rgba(56,189,248,0.15), 0 0 0 32px rgba(56,189,248,0.06)';
    o.style.animation = 'pulse 0.8s ease-in-out infinite';
    o.textContent = '🎙️';
    status.textContent = '聞いています... 話しかけてください';
    status.style.color = 'var(--accent)';
  } else if (s === 'speaking') {
    o.style.background = 'rgba(129,140,248,0.2)';
    o.style.borderColor = 'var(--accent2)';
    o.style.boxShadow = '0 0 0 12px rgba(129,140,248,0.12)';
    o.style.animation = 'pulse 1.2s ease-in-out infinite';
    o.textContent = '💬';
    status.textContent = 'AIが回答中...';
    status.style.color = 'var(--accent2)';
  } else {
    o.style.background = 'rgba(56,189,248,0.12)';
    o.style.borderColor = 'var(--accent)';
    o.style.boxShadow = '0 0 0 0 rgba(56,189,248,0.3)';
    o.style.animation = '';
    o.textContent = '🎤';
    status.textContent = 'タップして話しかける';
    status.style.color = 'var(--muted)';
  }
}

function schedNext(ms=2000) {
  setTimeout(() => {
    if (!recogOn) { startMic(); resetMicTimer(); }
  }, ms);
}


// ===== カメラ・室内解析 =====
let camStream = null;

async function startCam() {
  if (camStream) return;

  // まずカメラAPIが使えるか確認
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCamError('このブラウザはカメラに対応していません。Chromeをお使いください。');
    return;
  }

  // HTTPSチェック
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    showCamError('カメラはHTTPS環境でのみ動作します。');
    return;
  }

  try {
    // まず背面カメラで試行
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });
  } catch(e1) {
    try {
      // 失敗したら制約なしで試行
      camStream = await navigator.mediaDevices.getUserMedia({ video: true });
    } catch(e2) {
      const msg = e2.name === 'NotAllowedError'
        ? 'カメラの許可が必要です。\nアドレスバーの🔒をタップ→カメラ→許可 に変更してください。'
        : e2.name === 'NotFoundError'
        ? 'カメラが見つかりません。'
        : 'カメラエラー: ' + e2.message;
      showCamError(msg);
      return;
    }
  }

  const v = document.getElementById('camVideo');
  v.srcObject = camStream;
  v.style.display = 'block';
  document.getElementById('camPh').style.display = 'none';
  document.getElementById('sf').classList.add('on');
  document.getElementById('scan').classList.add('on');
  document.getElementById('resultText').textContent = 'カメラ起動完了。解析モードを選択してください。';
  speak('カメラを起動しました。解析モードを選択してください。');
  resetCamTimer(); // カメラ自動オフタイマー開始
}

function showCamError(msg) {
  const el = document.getElementById('resultText');
  el.textContent = msg;
  el.className = 'result-text done';
  document.getElementById('camErrMsg').textContent = msg;
  speak(msg);
}

async function toggleCam() {
  if (camStream) stopCam();
  else await startCam();
}

function stopCam() {
  if (camStream) { camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  const v = document.getElementById('camVideo');
  v.style.display = 'none';
  v.srcObject = null;
  document.getElementById('camPh').style.display = 'block';
  document.getElementById('sf').classList.remove('on');
  document.getElementById('scan').classList.remove('on');
}

const SCAN_PROMPTS = {
  indoor: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この室内画像を見て以下を日本語で簡潔に説明してください：
1. 部屋の種類（リビング・寝室・廊下など）
2. おおよその広さと形状
3. 主要な家具・設備の配置
4. 移動の動線（どこからどこへ歩けるか）
5. 注意すべき障害物や段差
150字以内でやさしく説明してください。`,

  obstacle: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この画像から危険な要素を特定してください：
1. 段差・敷居の有無と高さ
2. 床上の障害物（物・コード類など）
3. 狭い通路や危険な箇所
4. 安全に移動できる経路
100字以内で、危険度が高いものから順に説明してください。`,

  exit: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この画像から出口・経路を案内してください：
1. 出口・ドアの位置と方向
2. 廊下・通路の場所
3. 安全な移動ルート
4. 緊急出口の有無
100字以内で具体的に案内してください。`,

  general: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この画像の場所・環境・危険な障害物・移動アドバイスを100字以内でやさしく説明してください。`
};

async function analyzeRoom(mode) {
  if (!camStream) {
    await startCam();
    await new Promise(r => setTimeout(r, 1000));
  }

  const v = document.getElementById('camVideo');
  const canvas = document.getElementById('canvas');
  canvas.width = v.videoWidth || 640;
  canvas.height = v.videoHeight || 480;
  canvas.getContext('2d').drawImage(v, 0, 0);
  const b64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

  const el = document.getElementById('resultText');
  el.textContent = '解析中...';
  el.className = 'result-text loading';

  const prompt = SCAN_PROMPTS[mode] || SCAN_PROMPTS.general;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });
    const d = await res.json();
    const result = d.content?.[0]?.text || '';
    if (result) {
      el.textContent = result;
      el.className = 'result-text done';
      speak(result);
      // AIタブにも結果を送る
      addBubble('ai', '📷 カメラ解析: ' + result);
    } else {
      throw new Error('empty');
    }
  } catch(e) {
    // フォールバック（モック）
    const mocks = {
      indoor: '室内環境を確認しました。フローリングの部屋です。正面に窓、左手にドア、右手にソファがあります。移動スペースは十分確保されています。',
      obstacle: '床面に注意が必要な物はありません。段差は確認できません。安全に移動できる環境です。',
      exit: '正面右手にドアがあります。廊下へつながっています。安全に出口へ向かえます。',
      general: '屋内環境です。明るく整頓されています。段差や大きな障害物は見当たりません。安全に移動できます。'
    };
    const result = mocks[mode] || mocks.general;
    el.textContent = result + '（オフライン解析）';
    el.className = 'result-text done';
    speak(result);
  }
}

// ===== 音声合成 =====
function speak(t) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'ja-JP'; u.rate = 0.9; u.pitch = 1.3;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang.startsWith('ja')&&v.name.includes('Kyoko'))
         || voices.find(v=>v.lang.startsWith('ja'));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis.onvoiceschanged = () => {};

// ===== UI =====
function setTab(btn, id) {
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}
