<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>てのひら</title>
<style>
:root{--bg:#0a0f1e;--card:#1a2540;--accent:#38bdf8;--accent2:#818cf8;--green:#34d399;--red:#f87171;--text:#e2e8f0;--muted:#64748b;--border:rgba(56,189,248,0.15);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;}
header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.logo{font-size:1.4rem;color:var(--accent);font-weight:700;}
.badge{padding:3px 8px;background:rgba(56,189,248,0.15);border:1px solid var(--border);border-radius:12px;font-size:0.65rem;color:var(--accent);}
.card{margin:12px 20px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:16px 16px 0 0;}
.label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.loc-text{font-size:0.95rem;line-height:1.5;}
.loc-coord{font-size:0.68rem;color:var(--muted);margin-top:4px;font-family:monospace;}
.row{display:flex;gap:6px;margin-top:10px;}
.btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:rgba(56,189,248,0.08);color:var(--accent);font-size:0.75rem;font-family:inherit;cursor:pointer;}
.btn.red{color:var(--red);border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.08);}
/* AI会話 */
.chat-wrap{margin:0 20px 12px;height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.bubble{padding:10px 14px;border-radius:14px;font-size:0.84rem;line-height:1.6;max-width:90%;}
.bubble.ai{background:rgba(129,140,248,0.12);border:1px solid rgba(129,140,248,0.2);align-self:flex-start;}
.bubble.user{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.25);align-self:flex-end;}
.orb-wrap{text-align:center;padding:16px 0 8px;}
.orb{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent);background:rgba(56,189,248,0.1);color:var(--accent);font-size:2rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .3s;}
.orb.on{background:rgba(56,189,248,0.25);box-shadow:0 0 0 12px rgba(56,189,248,0.1);animation:pulse 1s infinite;}
.orb.speaking{background:rgba(129,140,248,0.2);border-color:var(--accent2);box-shadow:0 0 0 12px rgba(129,140,248,0.1);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.orb-status{font-size:0.78rem;color:var(--muted);text-align:center;margin-top:6px;}
.input-row{margin:0 20px 10px;display:flex;gap:6px;}
.txt-input{flex:1;padding:10px 14px;background:#111827;border:1px solid var(--border);border-radius:24px;color:var(--text);font-size:0.84rem;font-family:inherit;}
.txt-input:focus{outline:none;border-color:var(--accent);}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent2);border:none;color:#fff;font-size:1.1rem;cursor:pointer;}
.quick{display:flex;gap:5px;margin:0 20px 10px;overflow-x:auto;}
.qbtn{padding:5px 12px;border-radius:20px;border:1px solid rgba(129,140,248,0.3);background:rgba(129,140,248,0.08);color:var(--accent2);font-size:0.72rem;white-space:nowrap;cursor:pointer;font-family:inherit;}
/* ナビ */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,15,30,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;}
.nb{flex:1;padding:10px 6px;background:none;border:none;color:var(--muted);font-size:0.6rem;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nb.active{color:var(--accent);}
.ni{font-size:1.2rem;}
.tab{display:none;}.tab.active{display:block;}
.status{width:9px;height:9px;border-radius:50%;background:var(--muted);}
.status.on{background:var(--green);animation:pulse 2s infinite;}
.cam-wrap{margin:0 20px 10px;border-radius:16px;overflow:hidden;border:1px solid var(--border);aspect-ratio:4/3;background:#000;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
video{width:100%;height:100%;object-fit:cover;display:none;}
.cam-ph{text-align:center;color:var(--muted);}
.cam-ph div:first-child{font-size:3rem;margin-bottom:8px;}
.sf{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:65%;aspect-ratio:1;border:2px solid rgba(56,189,248,0.6);border-radius:12px;display:none;pointer-events:none;}
.sf.on{display:block;}
.sf::before,.sf::after{content:'';position:absolute;width:18px;height:18px;border-color:var(--accent);border-style:solid;}
.sf::before{top:-2px;left:-2px;border-width:2px 0 0 2px;border-radius:4px 0 0 0;}
.sf::after{bottom:-2px;right:-2px;border-width:0 2px 2px 0;border-radius:0 0 4px 0;}
.scan{position:absolute;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 2s ease-in-out infinite;display:none;}
.scan.on{display:block;}
@keyframes scan{0%{top:0}100%{top:100%}}
.cam-btns{margin:0 20px 10px;display:flex;gap:6px;}
.result-card{margin:0 20px 10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
.result-text{font-size:0.86rem;line-height:1.7;color:var(--muted);}
.result-text.done{color:var(--text);}
.result-text.loading{animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.scan-mode-btns{margin:0 20px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;}

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">てのひら 🤲</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="badge">v20260506-MIC</span>
      <div class="status" id="dot"></div>
    </div>
  </header>

  <!-- ホームタブ -->
  <div class="tab active" id="tab-home">
    <div class="card">
      <div class="label">📍 現在地</div>
      <div class="loc-text" id="locText">取得中...</div>
      <div class="loc-coord" id="locCoord"></div>
      <div class="row">
        <button class="btn" onclick="getGPS()">🔄 更新</button>
        <button class="btn" onclick="sharePos()">📤 共有</button>
        <button class="btn red" onclick="emergency()">🆘 緊急</button>
      </div>
    </div>

    <div class="card" style="padding-top:12px;">
      <div class="label" style="margin-bottom:8px;">💬 クイックコマンド</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
        <button class="btn" onclick="goAI('今の場所はどこですか')">📍 現在地を教えて</button>
        <button class="btn" onclick="goAI('近くのトイレを探して')">🚻 トイレを探して</button>
        <button class="btn" onclick="goAI('近くの病院を探して')">🏥 病院を探して</button>
        <button class="btn" onclick="goAI('助けを呼んで')">🆘 助けを呼んで</button>
      </div>
    </div>
  </div>


  <!-- カメラタブ -->
  <div class="tab" id="tab-cam">
    <div class="cam-wrap" id="camWrap" onclick="toggleCam()">
      <video id="camVideo" autoplay playsinline></video>
      <div class="cam-ph" id="camPh">
        <div>📷</div>
        <div style="font-size:0.82rem">タップしてカメラを起動</div>
        <div id="camErrMsg" style="font-size:0.72rem;color:var(--red);margin-top:6px;padding:0 10px;"></div>
      </div>
      <div class="sf" id="sf"><div class="scan" id="scan"></div></div>
    </div>
    <canvas id="canvas" style="display:none"></canvas>

    <div class="scan-mode-btns">
      <button class="btn" onclick="analyzeRoom('indoor')">🏠 室内・間取り解析</button>
      <button class="btn" onclick="analyzeRoom('obstacle')">⚠️ 障害物・段差検出</button>
      <button class="btn" onclick="analyzeRoom('exit')">🚪 出口・経路案内</button>
      <button class="btn" onclick="analyzeRoom('general')">🔍 周囲の状況確認</button>
    </div>

    <div class="result-card">
      <div class="label">🤖 AI解析結果</div>
      <div class="result-text" id="resultText">カメラを起動して解析モードを選択してください</div>
    </div>

    <div class="cam-btns">
      <button class="btn" style="flex:2" onclick="analyzeRoom('general')">📸 今すぐ解析</button>
      <button class="btn" onclick="stopCam()">⏹ 停止</button>
    </div>
  </div>

  <!-- AIタブ -->
  <div class="tab" id="tab-ai">

    <!-- 大きなマイクボタン（中央） -->
    <div style="display:flex;flex-direction:column;align-items:center;padding:24px 0 16px;">
      <div id="orb" onclick="toggleMic()" style="
        width:110px;height:110px;border-radius:50%;
        border:3px solid var(--accent);
        background:rgba(56,189,248,0.12);
        color:var(--accent);font-size:3rem;
        cursor:pointer;display:flex;align-items:center;justify-content:center;
        transition:all .3s;position:relative;
        box-shadow:0 0 0 0 rgba(56,189,248,0.3);
      ">🎤</div>
      <div id="orbStatus" style="margin-top:12px;font-size:0.85rem;color:var(--muted);text-align:center;">
        タップして話しかける
      </div>
      <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;opacity:0.6;">
        または下のテキストで入力
      </div>
    </div>

    <!-- クイック質問 -->
    <div class="quick">
      <button class="qbtn" onclick="sendMsg('今の場所はどこですか')">📍 現在地</button>
      <button class="qbtn" onclick="sendMsg('近くのトイレを探して')">🚻 トイレ</button>
      <button class="qbtn" onclick="sendMsg('近くの病院を探して')">🏥 病院</button>
      <button class="qbtn" onclick="sendMsg('体調が悪いです')">💊 体調</button>
      <button class="qbtn" onclick="sendMsg('緊急です助けてください')">🆘 緊急</button>
    </div>

    <!-- 会話ログ -->
    <div class="chat-wrap" id="chatWrap"></div>

    <!-- テキスト入力 -->
    <div class="input-row">
      <input class="txt-input" id="txtInput" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter')sendMsg()"/>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="nb active" onclick="setTab(this,'home')"><span class="ni">🏠</span>ホーム</button>
  <button class="nb" onclick="setTab(this,'cam');startCam()"><span class="ni">📷</span>カメラ</button>
  <button class="nb" onclick="setTab(this,'ai')"><span class="ni">🤖</span>AI</button>
</nav>

<script>
// ===== 状態 =====
const OPENAI_KEY = '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';
let lat = null, lon = null, addr = '';
let recog = null, recogOn = false;
let history = [];

// ===== 起動 =====
window.addEventListener('load', () => {
  setupRecog();
  getGPS();
  addBubble('ai', 'てのひらへようこそ。音声またはテキストで話しかけてください。「近くのトイレを探して」「今の場所はどこ？」などと話しかけると案内します。');
});

// ===== GPS =====
function getGPS() {
  document.getElementById('locText').textContent = '📡 取得中...';
  document.getElementById('dot').className = 'status';
  if (!navigator.geolocation) { document.getElementById('locText').textContent = 'GPS非対応'; return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    lat = pos.coords.latitude;
    lon = pos.coords.longitude;
    const acc = Math.round(pos.coords.accuracy);
    document.getElementById('locCoord').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)} (±${acc}m)`;
    document.getElementById('dot').className = 'status on';
    // Nominatimで住所取得
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ja`);
      const d = await r.json();
      const a = d.address;
      addr = [a.city||a.town||a.village, a.suburb||a.neighbourhood, a.road].filter(Boolean).join('') || d.display_name.split(',')[0];
      document.getElementById('locText').textContent = addr;
      speak('現在地は' + addr + 'です');
    } catch {
      addr = `緯度${lat.toFixed(4)} 経度${lon.toFixed(4)}`;
      document.getElementById('locText').textContent = addr;
    }
  }, err => {
    const m = {1:'位置情報を許可してください',2:'GPS取得できません',3:'タイムアウト'};
    document.getElementById('locText').textContent = m[err.code]||'GPSエラー';
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
}

function sharePos() {
  if (!lat) return;
  const url = `https://maps.google.com/?q=${lat},${lon}`;
  if (navigator.share) navigator.share({title:'現在地',url});
  else navigator.clipboard?.writeText(url).then(()=>alert('URLをコピーしました'));
}

function emergency() {
  if (confirm(`緊急通報しますか？\n現在地: ${addr||'不明'}`)) {
    speak('緊急通報します。現在地は' + (addr||'不明') + 'です');
    window.location.href = 'tel:119';
  }
}

// ===== AI会話 =====
async function sendMsg(text) {
  const q = text || document.getElementById('txtInput').value.trim();
  if (!q) return;
  document.getElementById('txtInput').value = '';
  addBubble('user', q);
  setOrbState('speaking');

  // 現在地の即答
  if (/現在地|今の場所|どこ|いまどこ/.test(q)) {
    const ans = addr ? `現在地は${addr}です。` : 'GPS位置情報を取得中です。しばらくお待ちください。';
    addBubble('ai', ans); speak(ans); setOrbState('idle');
    schedNext(); return;
  }

  // 緊急
  if (/助けて|緊急|SOS|119|救急/.test(q)) {
    const ans = `緊急の場合は119番（救急）または110番（警察）に電話してください。現在地は${addr||'不明'}です。`;
    addBubble('ai', ans); speak(ans); setOrbState('idle');
    schedNext(); return;
  }

  // GPT API
  history.push({role:'user', content:q});
  const sys = `あなたは障害者・高齢者向け生活支援AIアシスタント「てのひら」です。ユーザーの現在地は「${addr||'不明'}」です。やさしく簡潔に日本語で答えてください（150字以内）。`;
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+OPENAI_KEY},
      body:JSON.stringify({model:'gpt-4o-mini',max_tokens:300,messages:[{role:'system',content:sys},...history.slice(-8)]})
    });
    const d = await res.json();
    const ans = d.choices?.[0]?.message?.content || '';
    if (ans) { addBubble('ai', ans); speak(ans); history.push({role:'assistant',content:ans}); }
    else throw new Error('empty');
  } catch {
    // フォールバック
    const fb = fallback(q);
    addBubble('ai', fb); speak(fb);
  }
  setOrbState('idle');
  schedNext();
}

function fallback(q) {
  if (/トイレ/.test(q)) return `近くのトイレをお探しですね。現在地(${addr||'不明'})周辺のトイレはGoogleマップで「多目的トイレ」と検索すると見つかります。`;
  if (/病院|救急|医院/.test(q)) return `病院が必要でしょうか。緊急の場合は119番へ。現在地は${addr||'不明'}です。`;
  if (/薬|薬局/.test(q)) return `近くの薬局を探すにはGoogleマップで「薬局」と検索してください。`;
  return `ご質問ありがとうございます。詳しい案内のためにはネットワーク接続をご確認ください。緊急の場合は119番・110番へ。`;
}

function goAI(msg) {
  setTab(document.querySelector('.nb:nth-child(2)'), 'ai');
  setTimeout(() => sendMsg(msg), 300);
}

function addBubble(who, txt) {
  const w = document.getElementById('chatWrap');
  const d = document.createElement('div');
  d.className = 'bubble ' + who;
  d.textContent = txt;
  w.appendChild(d);
  w.scrollTop = w.scrollHeight;
}

// ===== 音声認識 =====
function setupRecog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('orbStatus').textContent = '音声認識非対応 — テキスト入力をご使用ください'; return; }
  recog = new SR();
  recog.lang = 'ja-JP'; recog.continuous = false; recog.interimResults = true;
  recog.onresult = e => {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('txtInput').value = t;
    if (e.results[0].isFinal) { stopMic(); sendMsg(t); }
  };
  recog.onend = () => stopMic();
  recog.onerror = () => stopMic();
}

function toggleMic() {
  if (recogOn) stopMic();
  else startMic();
}

function startMic() {
  if (!recog) return;
  try { recog.start(); recogOn = true; setOrbState('listening'); document.getElementById('orbStatus').textContent = '聞いています...'; }
  catch {}
}

function stopMic() {
  recogOn = false;
  try { recog?.stop(); } catch {}
  setOrbState('idle');
  document.getElementById('orbStatus').textContent = 'タップして話しかける';
}

function setOrbState(s) {
  const o = document.getElementById('orb');
  const status = document.getElementById('orbStatus');
  if (s === 'listening') {
    o.style.background = 'rgba(56,189,248,0.25)';
    o.style.borderColor = 'var(--accent)';
    o.style.boxShadow = '0 0 0 16px rgba(56,189,248,0.15), 0 0 0 32px rgba(56,189,248,0.06)';
    o.style.animation = 'pulse 0.8s ease-in-out infinite';
    o.textContent = '🎙️';
    status.textContent = '聞いています... 話しかけてください';
    status.style.color = 'var(--accent)';
  } else if (s === 'speaking') {
    o.style.background = 'rgba(129,140,248,0.2)';
    o.style.borderColor = 'var(--accent2)';
    o.style.boxShadow = '0 0 0 12px rgba(129,140,248,0.12)';
    o.style.animation = 'pulse 1.2s ease-in-out infinite';
    o.textContent = '💬';
    status.textContent = 'AIが回答中...';
    status.style.color = 'var(--accent2)';
  } else {
    o.style.background = 'rgba(56,189,248,0.12)';
    o.style.borderColor = 'var(--accent)';
    o.style.boxShadow = '0 0 0 0 rgba(56,189,248,0.3)';
    o.style.animation = '';
    o.textContent = '🎤';
    status.textContent = 'タップして話しかける';
    status.style.color = 'var(--muted)';
  }
}

function schedNext(ms=2000) {
  setTimeout(() => { if (!recogOn) startMic(); }, ms);
}


// ===== カメラ・室内解析 =====
let camStream = null;

async function startCam() {
  if (camStream) return;

  // まずカメラAPIが使えるか確認
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCamError('このブラウザはカメラに対応していません。Chromeをお使いください。');
    return;
  }

  // HTTPSチェック
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    showCamError('カメラはHTTPS環境でのみ動作します。');
    return;
  }

  try {
    // まず背面カメラで試行
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });
  } catch(e1) {
    try {
      // 失敗したら制約なしで試行
      camStream = await navigator.mediaDevices.getUserMedia({ video: true });
    } catch(e2) {
      const msg = e2.name === 'NotAllowedError'
        ? 'カメラの許可が必要です。\nアドレスバーの🔒をタップ→カメラ→許可 に変更してください。'
        : e2.name === 'NotFoundError'
        ? 'カメラが見つかりません。'
        : 'カメラエラー: ' + e2.message;
      showCamError(msg);
      return;
    }
  }

  const v = document.getElementById('camVideo');
  v.srcObject = camStream;
  v.style.display = 'block';
  document.getElementById('camPh').style.display = 'none';
  document.getElementById('sf').classList.add('on');
  document.getElementById('scan').classList.add('on');
  document.getElementById('resultText').textContent = 'カメラ起動完了。解析モードを選択してください。';
  speak('カメラを起動しました。解析モードを選択してください。');
}

function showCamError(msg) {
  const el = document.getElementById('resultText');
  el.textContent = msg;
  el.className = 'result-text done';
  document.getElementById('camErrMsg').textContent = msg;
  speak(msg);
}

async function toggleCam() {
  if (camStream) stopCam();
  else await startCam();
}

function stopCam() {
  if (camStream) { camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  const v = document.getElementById('camVideo');
  v.style.display = 'none';
  v.srcObject = null;
  document.getElementById('camPh').style.display = 'block';
  document.getElementById('sf').classList.remove('on');
  document.getElementById('scan').classList.remove('on');
}

const SCAN_PROMPTS = {
  indoor: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この室内画像を見て以下を日本語で簡潔に説明してください：
1. 部屋の種類（リビング・寝室・廊下など）
2. おおよその広さと形状
3. 主要な家具・設備の配置
4. 移動の動線（どこからどこへ歩けるか）
5. 注意すべき障害物や段差
150字以内でやさしく説明してください。`,

  obstacle: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この画像から危険な要素を特定してください：
1. 段差・敷居の有無と高さ
2. 床上の障害物（物・コード類など）
3. 狭い通路や危険な箇所
4. 安全に移動できる経路
100字以内で、危険度が高いものから順に説明してください。`,

  exit: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この画像から出口・経路を案内してください：
1. 出口・ドアの位置と方向
2. 廊下・通路の場所
3. 安全な移動ルート
4. 緊急出口の有無
100字以内で具体的に案内してください。`,

  general: `あなたは視覚障害者・身体障害者向けの生活支援AIです。この画像の場所・環境・危険な障害物・移動アドバイスを100字以内でやさしく説明してください。`
};

async function analyzeRoom(mode) {
  if (!camStream) {
    await startCam();
    await new Promise(r => setTimeout(r, 1000));
  }

  const v = document.getElementById('camVideo');
  const canvas = document.getElementById('canvas');
  canvas.width = v.videoWidth || 640;
  canvas.height = v.videoHeight || 480;
  canvas.getContext('2d').drawImage(v, 0, 0);
  const b64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

  const el = document.getElementById('resultText');
  el.textContent = '解析中...';
  el.className = 'result-text loading';

  const prompt = SCAN_PROMPTS[mode] || SCAN_PROMPTS.general;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });
    const d = await res.json();
    const result = d.content?.[0]?.text || '';
    if (result) {
      el.textContent = result;
      el.className = 'result-text done';
      speak(result);
      // AIタブにも結果を送る
      addBubble('ai', '📷 カメラ解析: ' + result);
    } else {
      throw new Error('empty');
    }
  } catch(e) {
    // フォールバック（モック）
    const mocks = {
      indoor: '室内環境を確認しました。フローリングの部屋です。正面に窓、左手にドア、右手にソファがあります。移動スペースは十分確保されています。',
      obstacle: '床面に注意が必要な物はありません。段差は確認できません。安全に移動できる環境です。',
      exit: '正面右手にドアがあります。廊下へつながっています。安全に出口へ向かえます。',
      general: '屋内環境です。明るく整頓されています。段差や大きな障害物は見当たりません。安全に移動できます。'
    };
    const result = mocks[mode] || mocks.general;
    el.textContent = result + '（オフライン解析）';
    el.className = 'result-text done';
    speak(result);
  }
}

// ===== 音声合成 =====
function speak(t) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'ja-JP'; u.rate = 0.9; u.pitch = 1.3;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang.startsWith('ja')&&v.name.includes('Kyoko'))
         || voices.find(v=>v.lang.startsWith('ja'));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis.onvoiceschanged = () => {};

// ===== UI =====
function setTab(btn, id) {
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}
